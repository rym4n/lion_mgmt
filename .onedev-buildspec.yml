version: 38
jobs:
- name: build_image
  jobExecutor: docker
  steps:
  - !CheckoutStep
    name: 拉取最新代码
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_path@'
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: 编译
    runInContainer: true
    image: python:3.11-slim
    interpreter: !DefaultInterpreter
      commands: "pip3 install -U nuitka\nBASE_DIR=@project_path@\nfind \"$BASE_DIR\" -mindepth 2 -type f -name \"*.py\" | while read file; do\n    echo \"正在编译: $file\"    \n    dir=$(dirname \"$file\")\n    base_name=$(basename \"$file\" .py)    \n    nuitka --module \"$file\" --output-dir=\"$dir\"    \n    if [ $? -eq 0 ]; then\n        echo \"编译成功，删除原始文件: $file\"\n        rm \"$file\"\n    else\n        echo \"编译失败，保留原始文件: $file\"\n    fi\ndone\n"
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !BuildImageStep
    name: 构建镜像
    buildPath: '@project_path@'
    dockerfile: '@project_path@/Dockerfile'
    output: !RegistryOutput
      tags: dev.xy14qg.top/lion_mgmt/lion_mgmt:latest
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger
    branches: master
    projects: lion_mgmt
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
