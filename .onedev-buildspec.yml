version: 40
jobs:
- name: 托管云环境自动更新
  jobExecutor: tgy-deploy
  steps:
  - !CommandStep
    name: 更新docker-compose配置
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        NEW_VER=@tag@
        sed -i -E "s#(dev\.xy14qg\.top/lion_mgmt/lion_mgmt:)v[0-9]+\.[0-9]+\.[0-9]+#\1${NEW_VER}#" /opt/lion/docker-compose.yml
        docker-compose -f /opt/lion/docker-compose.yml --env-file /opt/lion/.env up -d
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - !DependencyFinishedTrigger
    projects: lion_mgmt
  jobDependencies:
  - jobName: x86构建
    requireSuccessful: true
    artifacts: '**'
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
- name: x86构建
  jobExecutor: local
  steps:
  - !CheckoutStep
    name: 拉取最新代码
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_path@'
    condition: SUCCESSFUL
    optional: false
  - !BuildImageStep
    name: 构建镜像
    buildPath: '@project_path@'
    dockerfile: '@project_path@/Dockerfile'
    output: !RegistryOutput
      tags: dev.xy14qg.top/lion_mgmt/lion_mgmt:@tag@
    condition: SUCCESSFUL
    optional: false
  triggers:
  - !TagCreateTrigger
    branches: master
    projects: lion_mgmt
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
- name: 信创arm构建
  jobExecutor: hw-arm
  steps:
  - !CheckoutStep
    name: 拉取最新代码
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_path@'
    condition: SUCCESSFUL
    optional: false
  - !BuildImageStep
    name: 构建镜像
    buildPath: '@project_path@'
    dockerfile: '@project_path@/Dockerfile'
    output: !RegistryOutput
      tags: swr.cn-north-4.myhuaweicloud.com/regulus.y/lion_mgmt:@tag@
    registryLogins:
    - registryUrl: swr.cn-north-4.myhuaweicloud.com
      userName: cn-north-4@@HPUAHLCE1EUOBHBSSTTL
      passwordSecret: DOCKER_REGISTRY_TOKEN
    condition: SUCCESSFUL
    optional: false
  triggers:
  - !TagCreateTrigger
    branches: master
    projects: lion_mgmt
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
