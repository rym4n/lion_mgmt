version: 39
jobs:
- name: ci
  jobExecutor: local
  steps:
  - !CheckoutStep
    name: 拉取最新代码
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_path@'
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: 替换key
    runInContainer: true
    image: alpine:latest
    interpreter: !ShellInterpreter
      shell: bash
      commands: |
        MESSAGE=$(git tag -l --format='%(contents)' @tag@)
        sed -i "s/\$\$\$LIC\$\$\$/${MESSAGE}/g" @project_path@/libs/utils.py
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !BuildImageStep
    name: 构建镜像
    buildPath: '@project_path@'
    dockerfile: '@project_path@/Dockerfile'
    output: !RegistryOutput
      tags: dev.xy14qg.top/lion_mgmt/lion_mgmt:@tag@
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !TagCreateTrigger
    branches: master
    projects: lion_mgmt
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
- name: cd
  jobExecutor: tgy-deploy
  steps:
  - !CommandStep
    name: 更新docker-compose配置
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        NEW_VER=@tag@
        sed -i -E "s#(dev\.xy14qg\.top/lion_mgmt/lion_mgmt:)v[0-9]+\.[0-9]+\.[0-9]+#\1${NEW_VER}#" /opt/lion/docker-compose.yml
        docker-compose -f /opt/lion/docker-compose.yml --env-file /opt/lion/.env up -d
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !DependencyFinishedTrigger
    projects: lion_mgmt
  jobDependencies:
  - jobName: ci
    requireSuccessful: true
    artifacts: '**'
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
