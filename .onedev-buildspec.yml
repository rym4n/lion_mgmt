version: 38
jobs:
- name: build_image
  jobExecutor: docker
  steps:
  - !CheckoutStep
    name: 拉取最新代码
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_path@'
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: 编译
    runInContainer: true
    image: python:3.11-slim
    interpreter: !DefaultInterpreter
      commands: |
        apt update -y && apt install build-essential -y
        pip3 install -U nuitka
        nuitka --follow-imports server.py
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !BuildImageStep
    name: 构建镜像
    buildPath: '@project_path@'
    dockerfile: '@project_path@/Dockerfile'
    output: !RegistryOutput
      tags: dev.xy14qg.top/lion_mgmt/lion_mgmt:latest
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger
    branches: master
    projects: lion_mgmt
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
