[project]
name = "lion-mgmt"
version = "0.1.0"
description = ""
authors = [{ name = "regulus.y", email = "xy14qg@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "aiocache[redis] (>=0.12.3,<0.13.0)",
    "tortoise-orm[asyncpg] (>=0.24.2,<0.25.0)",
    "aerich[toml] (>=0.8.2,<0.9.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "argon2-cffi (>=23.1.0,<24.0.0)",
    "httpx-oauth (>=0.16.1,<0.17.0)",
    "pyotp (>=2.9.0,<3.0.0)",
    "aiokafka (>=0.12.0,<0.13.0)",
    "aiofile (>=3.9.0,<4.0.0)",
    "caio (==0.9.21)",
    "websockets (==14.1)",
    "sanic (>=24.12.0,<25.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "sanic-ext (>=24.12.0,<25.0.0)",
    "orjson (>=3.10.16,<4.0.0)",
    "cryptography (>=44.0.2,<45.0.0)",
    "gmssl-python>=2.2.2",
    "msgpack>=1.1.0",
    "psutil>=7.0.0",
    "pillow>=11.2.1",
    "gmssl>=3.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "cython>=3.0.12",
    "dotenv>=0.9.9,<0.10",
    "nuitka>=2.7.1",
]

[tool.uv]
package = false
index-url = "https://mirrors.aliyun.com/pypi/simple"

[tool.aerich]
tortoise_orm = "settings.TORTOISE"
location = "./migrations"
src_folder = "./."
