[project]
name = "lion-mgmt"
version = "0.1.0"
description = ""
authors = [
    { name = "regulus.y", email = "xy14qg@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sanic[ext] (>=24.12.0,<25.0.0)",
    "aiocache[redis] (>=0.12.3,<0.13.0)",
    "tortoise-orm[asyncpg] (>=0.24.2,<0.25.0)",
]

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
dotenv = "^0.9.9"

[tool.poetry.group.dev.dependencies.aerich]
extras = [
    "toml",
]
version = "^0.8.2"

[tool.aerich]
tortoise_orm = "settings.TORTOISE"
location = "./migrations"
src_folder = "./."
