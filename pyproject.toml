[project]
name = "lion-mgmt"
version = "3.0.0"
description = ""
authors = [{ name = "regulus.y", email = "xy14qg@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "aiocache[redis]>=0.12.3",
    "tortoise-orm[asyncpg]>=0.24.2",
    "aerich[toml]>=0.8.2,<0.9.0",
    "pyjwt>=2.10.1",
    "argon2-cffi>=23.1.0",
    "httpx-oauth>=0.16.1",
    "pyotp>=2.9.0",
    "aiokafka>=0.12.0",
    "aiofile>=3.9.0",
    "caio==0.9.21",
    "websockets==16.0",
    "sanic==25.12.1",
    "pyyaml>=6.0.2",
    "sanic-ext==25.12.0",
    "orjson>=3.10.16",
    "cryptography>=44.0.2",
    "gmssl-python>=2.2.2",
    "msgpack>=1.1.0",
    "psutil>=7.0.0",
    "pillow>=11.2.1",
    "jsonpath>=0.82.2",
    "elasticsearch[async]==8.18.1",
    "aiohttp>=3.12.13",
    "croniter>=6.0.0",
    "jsonrpcserver>=5.0.9",
    "aioboto3>=15.4.0",
    "mcp>=1.26.0",
    "httpx>=0.28.0",
    "litellm>=1.82.0,<1.82.6",
    "openai>=2.8.0",
    # lion_mgmt 业务直接使用的文档处理库
    "lxml>=5.0.0,<7.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "docxtpl>=0.20.2",
    "pypinyin>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "cython>=3.0.12",
    "dotenv>=0.9.9,<0.10",
    "nuitka>=2.7.1",
]

[tool.uv]
package = false
index-url = "https://mirrors.aliyun.com/pypi/simple"
override-dependencies = [
    "boto3>=1.40.46,<1.40.62",
]

[tool.aerich]
tortoise_orm = "settings.TORTOISE"
location = "./migrations"
src_folder = "./."
