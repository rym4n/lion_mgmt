[project]
name = "lion-mgmt"
version = "0.1.0"
description = ""
authors = [
    { name = "regulus.y", email = "xy14qg@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "sanic[ext] (>=24.12.0,<25.0.0)",
    "aiocache[redis] (>=0.12.3,<0.13.0)",
    "tortoise-orm[asyncpg] (>=0.24.2,<0.25.0)",
    "aerich[toml] (>=0.8.2,<0.9.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "argon2-cffi (>=23.1.0,<24.0.0)",
    "httpx-oauth (>=0.16.1,<0.17.0)",
    "pyotp (>=2.9.0,<3.0.0)",
    "confluent-kafka (>=2.8.2,<3.0.0)",
    "aiokafka (>=0.12.0,<0.13.0)",
    "aiofile (>=3.9.0,<4.0.0)",
    "caio (==0.9.21)",
    "ujson (>=5.10.0,<6.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
]

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
dotenv = "^0.9.9"

[tool.aerich]
tortoise_orm = "settings.TORTOISE"
location = "./migrations"
src_folder = "./."
