name: P6 LLM Config Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'models/llm_model_config.py'
      - 'services/llm_config/**'
      - 'services/digital_employee/manager.py'
      - 'migrations/models/105_*.py'
      - 'tests/llm_config/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'models/llm_model_config.py'
      - 'services/llm_config/**'
      - 'services/digital_employee/manager.py'
      - 'migrations/models/105_*.py'
      - 'tests/llm_config/**'

jobs:
  test-p6-llm-config:
    name: P6 LLM Config Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run P6 model tests
        run: |
          PYTHONPATH=/opt/dev/aioe/lion_mgmt:$PYTHONPATH \
          uv run pytest tests/llm_config/test_model_dimensions.py -v
        continue-on-error: false

      - name: Run P6 resolver tests
        run: |
          uv run pytest tests/llm_config/test_resolver.py::test_embedding_purpose_carries_dimensions -v
          uv run pytest tests/llm_config/test_resolver.py::test_chat_config_resolves_dimensions_as_none -v
          uv run pytest tests/llm_config/test_resolver.py::test_embedding_payload_uses_model_key_not_model_name -v
          uv run pytest tests/llm_config/test_resolver.py::test_chat_payload_shape_is_unchanged_by_dimensions_field -v
          uv run pytest tests/llm_config/test_resolver.py::test_embedding_without_dimensions_yields_three_key_payload -v
          uv run pytest tests/llm_config/test_resolver.py::test_payload_never_contains_explicit_null_dimensions -v
          uv run pytest tests/llm_config/test_resolver.py::test_repr_still_hides_api_key_after_adding_dimensions -v
        continue-on-error: true

      - name: Run menu convergence tests
        run: |
          uv run pytest tests/llm_config/test_menu_convergence.py -v
        continue-on-error: false

      - name: Validate migration file
        run: |
          # 检查 105 迁移文件存在
          test -f migrations/models/105_20260817_llm_config_dimensions_and_convergence.py

          # 编译检查
          uv run python -m py_compile migrations/models/105_20260817_llm_config_dimensions_and_convergence.py

          # 验证包含必要的 SQL 关键字
          grep -q "ALTER TABLE.*llm_model_config.*ADD COLUMN.*dimensions" migrations/models/105_*.py
          grep -q "UPDATE llm_model_config" migrations/models/105_*.py
          grep -q "INSERT INTO menu_config" migrations/models/105_*.py
        continue-on-error: false

      - name: Test summary
        if: always()
        run: |
          echo "## P6 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Model dimensions tests: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Resolver payload tests: (check logs)" >> $GITHUB_STEP_SUMMARY
          echo "- Menu convergence tests: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Migration validation: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  lint-p6-code:
    name: P6 Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Compile all P6 modules
        run: |
          uv run python -m py_compile models/llm_model_config.py
          uv run python -m py_compile services/llm_config/resolver.py
          uv run python -m py_compile services/llm_config/manager.py
          uv run python -m py_compile services/llm_config/views.py
          uv run python -m py_compile services/digital_employee/manager.py
          uv run python -m py_compile migrations/models/105_*.py

      - name: Check for hardcoded tenant IDs
        run: |
          # 确保只有正确的 DEFAULT_TENANT_ID
          ! grep -r "tenant_id.*=.*['\"]" services/llm_config/ | grep -v "8bce552d-c27c-41d4-8a1b-8c5bf38dfe18" | grep -v "comment"

      - name: Verify catalog API whitelist
        run: |
          # catalog 不得返回 base_url / api_key / remark
          ! grep -A 20 "def list_catalog" services/llm_config/manager.py | grep -E "(base_url|api_key|remark).*:"
