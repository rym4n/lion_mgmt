name: mgmt镜像构建

on:
  push:
    branches: [ main ]
    tags: [ "v3.1.*" ]

jobs:
  build-images:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    env:
      REGISTRY_IMAGE: reg.hongcloud.net/lion_mgmt

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/aioe-version.sh validate "${GITHUB_REF#refs/tags/}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: reg.hongcloud.net
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=lion_mgmt-${{ matrix.arch }}
          cache-to: type=gha,scope=lion_mgmt-${{ matrix.arch }},mode=max
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-images
    env:
      REGISTRY_IMAGE: reg.hongcloud.net/lion_mgmt

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: reg.hongcloud.net
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected 2 architecture digests, found ${#digests[@]}" >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:${{ steps.meta.outputs.tag }}" \
            "${sources[@]}"

      - name: Inspect multi-arch manifest
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.tag }}"
