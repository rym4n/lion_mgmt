name: mgmt镜像构建

on:
  push:
    branches: [ main ]
    tags: [ "v3.1.*" ]

jobs:
  build-images:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    env:
      REGISTRY_IMAGE: reg.hongcloud.net/lion_mgmt
      IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/aioe-version.sh validate "${GITHUB_REF#refs/tags/}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: reg.hongcloud.net
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=lion_mgmt-${{ matrix.arch }}
          cache-to: type=gha,scope=lion_mgmt-${{ matrix.arch }},mode=max
          provenance: false

  merge-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-images
    env:
      REGISTRY_IMAGE: reg.hongcloud.net/lion_mgmt
      IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: reg.hongcloud.net
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:${IMAGE_TAG}" \
            "${REGISTRY_IMAGE}:${IMAGE_TAG}-amd64" \
            "${REGISTRY_IMAGE}:${IMAGE_TAG}-arm64"

      - name: Inspect multi-arch manifest
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${IMAGE_TAG}"
